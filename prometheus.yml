global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    # node_exporter is optional. For local Docker testing, use the Linux host setup
    # described in README.md or add another node_exporter target here.
    static_configs:
      - targets: ["node-exporter:9100"]

